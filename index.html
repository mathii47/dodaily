<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
</head>
<body>

    <div class="topbar">
        <div>
            <h1>My To-Do List</h1>
            <p id="profileGreeting"></p>
        </div>
        <div class="topbar-icons">
            <button onclick="toggleDarkMode()" id="darkBtn">🌙</button>
            <div class="menu-wrapper">
                <button onclick="toggleMenu()" id="menuBtn">⋮</button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button onclick="openProfile()">👤 Your Profile</button>
                    <button onclick="toggleNotifPermission()">🔔 Notification Settings</button>
                    <button onclick="sortTasks()">↕️ Sort Tasks</button>
                    <button onclick="exportTasks()">⬇️ Export / Backup Tasks</button>
                    <button onclick="clearAllTasks()" class="danger">🗑️ Clear All Tasks</button>
                    <button onclick="aboutApp()">ℹ️ About</button>
                </div>
            </div>
        </div>
    </div>

    <p id="taskCount">0 tasks pending</p>

    <input type="text" id="taskInput" placeholder="Enter your task">
    <select id="taskCategory">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Study">Study</option>
        <option value="Other">Other</option>
    </select>
    <input type="date" id="taskDate">
    <input type="time" id="taskTime">
    <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
    </select>
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
</html>
