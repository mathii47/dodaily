<!DOCTYPE html>
<html>
<head>
    <title>DoDAILY - To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
</head>

<body>

    <div class="topbar">
        <div>
            <h1>DoDAILY</h1>
            <p id="profileGreeting"></p>
        </div>

        <div class="topbar-icons">
            <button onclick="toggleDarkMode()" id="darkBtn">🌙</button>
            <button onclick="openDrawer()" id="menuBtn">⋮</button>
        </div>
    </div>

    <p id="taskCount">0 tasks pending</p>

    <div class="task-form">

        <input type="text" id="taskInput" placeholder="Enter your task">

        <select id="taskCategory">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
        </select>

        <input type="date" id="taskDate">

        <input type="time" id="taskTime">

        <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <button onclick="addTask()" class="addBtn">
            Add Task
        </button>

    </div>

    <ul id="taskList"></ul>

    <div id="overlay" onclick="closeDrawer()"></div>


    <!-- MENU -->

    <div id="sideDrawer" class="drawer">

        <div class="drawer-header">
            <span>Menu</span>

            <button onclick="closeDrawer()" class="closeBtn">
                X
            </button>
        </div>

        <div class="drawer-list">

            <button onclick="openProfile()">
                👤 Your Profile
            </button>

            <button onclick="openSettingsPanel()">
                ⚙️ Settings
            </button>

            <button onclick="toggleNotifPermission()">
                🔔 Notification Settings
            </button>

            <button onclick="sortTasks()">
                ↕️ Sort Tasks
            </button>

            <button onclick="exportTasks()">
                💾 Export / Backup Tasks
            </button>

            <button onclick="clearAllTasks()" class="danger">
                🗑️ Clear All Tasks
            </button>

            <button onclick="aboutApp()">
                ℹ️ About
            </button>

        </div>
    </div>


    <!-- PROFILE -->

    <div id="profileDrawer" class="drawer">

        <div class="drawer-header">

            <button onclick="backToMenu()" class="closeBtn">
                Back
            </button>

            <span>Your Profile</span>

            <button onclick="closeDrawer()" class="closeBtn">
                X
            </button>

        </div>

        <div class="profile-content">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileNameDisplay">
                Your Name
            </h2>

            <p id="profileUsernameDisplay">
                @username
            </p>

            <p id="profileEmailDisplay">
                your@email.com
            </p>

            <hr>

            <div class="profile-info">

                <p>
                    <strong>Name</strong><br>
                    <span id="profileNameInfo">-</span>
                </p>

                <p>
                    <strong>Username</strong><br>
                    <span id="profileUsernameInfo">-</span>
                </p>

                <p>
                    <strong>Email</strong><br>
                    <span id="profileEmailInfo">-</span>
                </p>

            </div>

            <button onclick="editProfile()" class="editProfileBtn">
                Edit Profile
            </button>

        </div>
    </div>


    <!-- SETTINGS -->

    <div id="settingsDrawer" class="drawer">

        <div class="drawer-header">

            <button onclick="backToMenu()" class="closeBtn">
                Back
            </button>

            <span>Settings</span>

            <button onclick="closeDrawer()" class="closeBtn">
                X
            </button>

        </div>

        <div class="drawer-list">

            <div class="setting-row">
                <span>Layout</span>

                <select id="layoutSelect" onchange="applyLayout()">
                    <option value="compact">Compact</option>
                    <option value="spacious">Spacious</option>
                </select>
            </div>


            <div class="setting-row">
                <span>Theme Color</span>

                <select id="themeSelect" onchange="applyTheme()">
                    <option value="indigo">Indigo</option>
                    <option value="green">Green</option>
                    <option value="orange">Orange</option>
                    <option value="pink">Pink</option>
                    <option value="black">Black</option>
                </select>
            </div>


            <div class="setting-row">
                <span>Font Size</span>

                <select id="fontSelect" onchange="applyFontSize()">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>

        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
