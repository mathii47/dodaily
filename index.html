<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
</head>
<body>

    <div class="topbar">
        <div>
            <h1>My To-Do List</h1>
            <p id="profileGreeting"></p>
        </div>
        <div class="topbar-icons">
            <button onclick="toggleDarkMode()" id="darkBtn">🌙</button>
            <button onclick="openDrawer()" id="menuBtn">⋮</button>
        </div>
    </div>

    <p id="taskCount">0 tasks pending</p>

    <input type="text" id="taskInput" placeholder="Enter your task">
    <select id="taskCategory">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Study">Study</option>
        <option value="Other">Other</option>
    </select>
    <input type="date" id="taskDate">
    <input type="time" id="taskTime">
    <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
    </select>
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <!-- Overlay -->
    <div id="overlay" onclick="closeDrawer()"></div>

    <!-- Side drawer (main menu) -->
    <div id="sideDrawer" class="drawer">
        <div class="drawer-header">
            <span>Menu</span>
            <button onclick="closeDrawer()" class="closeBtn">✕</button>
        </div>
        <div class="drawer-list">
            <button onclick="openProfile()">👤 <span>Your Profile</span></button>
            <button onclick="openSettingsPanel()">⚙️ <span>Settings</span></button>
            <button onclick="toggleNotifPermission()">🔔 <span>Notification Settings</span></button>
            <button onclick="sortTasks()">↕️ <span>Sort Tasks</span></button>
            <button onclick="exportTasks()">⬇️ <span>Export / Backup Tasks</span></button>
            <button onclick="clearAllTasks()" class="danger">🗑️ <span>Clear All Tasks</span></button>
            <button onclick="aboutApp()">ℹ️ <span>About</span></button>
        </div>
    </div>

    <!-- Side drawer (settings sub-panel) -->
    <div id="settingsDrawer" class="drawer">
        <div class="drawer-header">
            <button onclick="backToMenu()" class="closeBtn">←</button>
            <span>Settings</span>
            <button onclick="closeDrawer()" class="closeBtn">✕</button>
        </div>
        <div class="drawer-list">
            <div class="setting-row">
                <span>Layout</span>
                <select id="layoutSelect" onchange="applyLayout()">
                    <option value="compact">Compact</option>
                    <option value="spacious">Spacious (Desktop-style)</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Theme Color</span>
                <select id="themeSelect" onchange="applyTheme()">
                    <option value="indigo">Indigo</option>
                    <option value="green">Green</option>
                    <option value="orange">Orange</option>
                    <option value="pink">Pink</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Font Size</span>
                <select id="fontSelect" onchange="applyFontSize()">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
